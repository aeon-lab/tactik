name: Draft PDF
on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      
      - name: Copy PDF to paper directory
        run: |
          # Find the generated PDF
          PDF_PATH=$(find /tmp -name "*.pdf" -type f -exec ls -t {} + | head -1)
          if [ -z "$PDF_PATH" ]; then
            echo "❌ No PDF found!"
            exit 1
          fi
          echo "Found PDF at: $PDF_PATH"
          
          # Copy to the same directory as paper.md
          cp "$PDF_PATH" paper/paper.pdf
          echo "✅ PDF copied to paper/paper.pdf"
          ls -lh paper/paper.pdf
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf