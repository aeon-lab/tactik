name: Draft PDF
on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build PDF with Docker directly
        run: |
          # Run the same container the action uses
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            openjournals/inara:latest \
            -o pdf paper/paper.md
          
          # The PDF should now be in paper/ directory
          ls -la paper/*.pdf
          
          # If it's not there, check for it
          find . -name "*.pdf" -exec cp {} paper/paper.pdf \;
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf