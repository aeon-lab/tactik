name: Test and Publish to PyPI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .

      - name: Run tests
        run: |
          export PYTHONPATH=src/tactik
          python -W ignore -m unittest discover -s tests

      - name: Build and validate distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke test installed wheel imports
        shell: bash
        run: |
          python -m pip uninstall -y tactik
          python -m pip install --no-deps dist/*.whl
          python -c "import tactik; from tactik import utilities; from tactik.clustering_pipeline import ClusteringPipeline; print(tactik.__version__)"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --username __token__ dist/*
